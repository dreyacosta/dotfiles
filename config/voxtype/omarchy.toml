# Voxtype configuration for Omarchy.
# Hyprland owns Super + V, so Voxtype's evdev hotkey stays disabled.

state_file = "auto"
engine = "whisper"

[hotkey]
enabled = false
key = "RIGHTALT"
mode = "push_to_talk"

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 60
pause_media = true

[whisper]
model = "small"
language = ["en", "es"]
translate = false
mode = "local"
flash_attention = false
on_demand_loading = false
gpu_isolation = false

[output]
mode = "type"
fallback_to_clipboard = true
type_delay_ms = 1

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = false
