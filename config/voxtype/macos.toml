# Voxtype configuration for macOS.
# Voxtype's native global hotkey remains enabled on macOS.

state_file = "auto"
engine = "whisper"

[hotkey]
enabled = true

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 60

[whisper]
model = "small"
language = ["en", "es"]
translate = false
mode = "local"

[output]
mode = "type"
fallback_to_clipboard = true
type_delay_ms = 1

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = false
